name: Build and Deploy Docker Container
on:
  push:
    branches:
      - master

jobs:
  prod:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Private Registry
        uses: docker/login-action@v3
        with:
          registry: git.stuffworks.net
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            git.stuffworks.net/psnail273/hardybert-wedding-website:latest
            git.stuffworks.net/psnail273/hardybert-wedding-website:${{ github.sha }}
          cache-from: type=registry,ref=git.stuffworks.net/psnail273/hardybert-wedding-website:buildcache
          cache-to: type=registry,ref=git.stuffworks.net/psnail273/hardybert-wedding-website:buildcache,mode=max

      - name: Clean up old images
        run: |
          # Remove old hardybert-wedding-website images (keep latest)
          docker images git.stuffworks.net/psnail273/hardybert-wedding-website --format "table {{.Repository}}:{{.Tag}}\t{{.ID}}" | grep -v "latest\|buildcache" | awk 'NR>1 {print $2}' | xargs -r docker rmi || true

      - name: Create .env file from secrets
        run: |
          cat > .env << EOF
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          RSVP_PASSWORD=${{ secrets.RSVP_PASSWORD }}
          EOF

      - name: Deploy container
        run: |
          docker pull git.stuffworks.net/psnail273/hardybert-wedding-website:latest
          docker stop hardybert-wedding-website || true
          docker rm hardybert-wedding-website || true
          docker run -d \
            --name hardybert-wedding-website \
            --restart unless-stopped \
            --network caddy-network \
            --env-file .env \
            git.stuffworks.net/psnail273/hardybert-wedding-website:latest

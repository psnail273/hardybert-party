name: Build and Deploy Docker Container
on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"
          cache: "npm"

      - name: Cache Docker layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Private Registry
        uses: docker/login-action@v2
        with:
          registry: git.stuffworks.net
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            git.stuffworks.net/psnail273/hardybert-wedding-website:latest
            git.stuffworks.net/psnail273/hardybert-wedding-website:${{ github.sha }}
          cache-from: |
            type=registry,ref=git.stuffworks.net/psnail273/hardybert-wedding-website:latest
            type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Create .env file from secrets
        run: |
          cat > .env << EOF
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          RSVP_PASSWORD=${{ secrets.RSVP_PASSWORD }}
          EOF

      - name: Deploy container
        run: |
          docker pull git.stuffworks.net/psnail273/hardybert-wedding-website:latest
          docker stop hardybert-wedding-website || true
          docker rm hardybert-wedding-website || true
          docker run -d \
            --name hardybert-wedding-website \
            --restart unless-stopped \
            --network caddy-network \
            --env-file .env \
            -p 3005:3000 \
            git.stuffworks.net/psnail273/hardybert-wedding-website:latest

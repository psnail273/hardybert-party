name: Build and Deploy Docker Container
on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Private Registry
        uses: docker/login-action@v2
        with:
          registry: git.stuffworks.net
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            git.stuffworks.net/hardybert-wedding-website:latest
            git.stuffworks.net/hardybert-wedding-website:${{ github.sha }}
          cache-from: type=registry,ref=git.stuffworks.net/hardybert-wedding-website:latest
          cache-to: type=inline

      - name: Deploy container
        run: |
          docker pull git.stuffworks.net/hardybert-wedding-website:latest
          docker stop nextjs-app || true
          docker rm nextjs-app || true
          docker run -d \
            --name hardybert-wedding-website \
            --restart unless-stopped \
            -p 83:80 \
            git.stuffworks.net/hardybert-wedding-website:latest